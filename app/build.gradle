plugins {
    id 'com.android.application'
}

android {
    namespace 'org.dublift.app'
    compileSdk 35
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId 'org.dublift.app'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(project.findProperty('releaseVersionCode') ?: '1')
        versionName (project.findProperty('releaseVersionName') ?: '1.0.0').toString()
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    sourceSets {
        main { jniLibs.srcDirs = ['build/generated/jniLibs'] }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libdublift.so', '**/libffmpeg.so', '**/libffprobe.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareNative', Exec) {
    commandLine 'bash', "${rootProject.projectDir}/scripts/prepare-native.sh"
}
tasks.named('preBuild').configure { dependsOn 'prepareNative' }
